name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  # ==========================================
  # Build Native iOS App (.ipa) on macOS
  # ==========================================
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Verify Xcode & Tools
        run: |
          xcodebuild -version
          pod --version || true

      - name: Build Xcode Project
        run: |
          xcodebuild clean build \
            -project ios/AttendPro.xcodeproj \
            -scheme AttendPro \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT=build

      - name: Package .ipa File
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/AttendPro.app Payload/
          zip -r AttendPro.ipa Payload
          ls -lh AttendPro.ipa

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendPro-iOS-IPA
          path: AttendPro.ipa
          retention-days: 14
